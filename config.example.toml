# livetrans 配置
# 所有项都可以省略，省略时用代码里的默认值（见 livetrans/config.py）。
# 也可以用环境变量覆盖，格式 LIVETRANS_<段名>_<字段名>，例如 LIVETRANS_ASR_MODEL=medium

[audio]
# 捕获哪个播放设备的声音。留空 = 系统默认播放设备。
# 也可以填环回设备名的一部分，比如 "扬声器" / "Speakers" / "Headphones"。
# 用 `python -m livetrans --devices` 能看到全部可用设备及其确切名字。
device = ""
# 送给识别器的采样率，16k 是 whisper 的标准输入，不用改
sample_rate = 16000
# 每次读取的音频块长度（秒）
block_seconds = 0.1
# 输入增益。如果直播声音偏小导致识别不稳，可以调到 1.5 ~ 2.0
gain = 1.0


[vad]
# 语音判定阈值，调高更“保守”（不容易把 BGM 当人声），调低更灵敏
threshold = 0.5
# 连续多久像人声才认为开始说话（毫秒）
min_speech_ms = 160
# 连续多久没声音才认为一句说完（毫秒）。
# 调小 = 字幕出得更快，但容易把主播换气的停顿当句末而把句子切碎；
# 调大 = 句子更完整、翻译更准，代价是字幕晚一点出来
min_silence_ms = 700
# 一句话最长多少秒，超过就强制切一刀，避免字幕迟迟不出
max_segment_seconds = 12.0
# 每句前后各留多少毫秒，防止吃掉字头字尾
padding_ms = 240
# 比这还短的碎片直接丢弃（过滤咳嗽、键盘、鼠标声）
min_segment_seconds = 0.4
# 【关键项】短于这个秒数的语音段先攒着，等下一句接上再一起送翻译。
# 没有它的话「ゲームで / 遊ばせて / いただこうと / 思い」这种一整句
# 会被拆成四段分别翻译，意思全乱。调大 = 句子更完整，但字幕更晚出来。
merge_seconds = 2.5
# 攒着的短句最多再等多少毫秒；超过就认定确实说完了，单独送出去
hold_ms = 1200


[asr]
# faster-whisper 模型。8GB 显存推荐 large-v3-turbo（快且准）；
# 显存紧张或想更快可以用 medium / small；显存很足可以试 large-v3
model = "large-v3-turbo"
# auto（先试 cuda 失败退 cpu）| cuda | cpu
device = "auto"
# auto | float16 | int8_float16 | int8 | float32
compute_type = "auto"
# 识别语言，日语直播就保持 ja
language = "ja"
# 贪心解码，最快；改成 2~5 会稍准一点但更慢
beam_size = 1
# 提示词：把常看的主播名、专有名词写进去，可以稳定这些词的写法，例如
# initial_prompt = "ホロライブ、兎田ぺこら、さくらみこ、星街すいせい。"
initial_prompt = ""
# 国内网络下载模型慢的话，取消注释用镜像
# hf_endpoint = "https://hf-mirror.com"
hf_endpoint = ""
# 等待识别的片段队列长度，识别跟不上时会丢弃最旧的
max_queue = 8


[translate]
# 四种后端，选一个：
#   openai    = 任何 OpenAI 兼容接口 —— 国内外绝大多数厂商都属于这一类，见下面速查表
#   anthropic = Anthropic Claude（接口格式和 OpenAI 不同，单独实现）
#   gemini    = Google Gemini
#   none      = 不翻译，只显示日文原文
provider = "openai"

# 目标语言。写具体一点质量更好，例如 "简体中文" / "繁體中文" / "English"
target_language = "简体中文"

# --- provider = "openai"（默认走 DeepSeek）---
# base_url / model 留空 = https://api.deepseek.com/v1 + deepseek-chat
base_url = ""
model = ""

# 主流厂商速查：下面这些都用 provider = "openai"，只改 base_url + model 即可
#   DeepSeek       https://api.deepseek.com/v1                         deepseek-chat
#   OpenAI         https://api.openai.com/v1                           gpt-4o-mini
#   月之暗面 Kimi   https://api.moonshot.cn/v1                          moonshot-v1-8k
#   智谱 GLM       https://open.bigmodel.cn/api/paas/v4                 glm-4-flash
#   通义千问        https://dashscope.aliyuncs.com/compatible-mode/v1    qwen-plus
#   硅基流动        https://api.siliconflow.cn/v1                        Qwen/Qwen2.5-7B-Instruct
#   OpenRouter     https://openrouter.ai/api/v1                         google/gemini-2.0-flash-001
#   Grok (xAI)     https://api.x.ai/v1                                  grok-2-latest
#   Groq           https://api.groq.com/openai/v1                       llama-3.3-70b-versatile
#   Mistral        https://api.mistral.ai/v1                            mistral-small-latest
#   火山方舟        https://ark.cn-beijing.volces.com/api/v3             你的接入点 ID
#   本地 ollama     http://localhost:11434/v1                            qwen2.5:7b

# --- provider = "anthropic"（Claude）---
# base_url 留空 = https://api.anthropic.com
# model   留空 = claude-3-5-haiku-latest

# --- provider = "gemini" ---
# base_url 留空 = https://generativelanguage.googleapis.com/v1beta
# model   留空 = gemini-2.5-flash

# API key。两种填法，选一个：
#   1) 留空，改用环境变量（推荐，key 不落进任何文件）—— 见下面的 api_key_env
#   2) 直接填在这儿。填了之后：本文件请另存为 config.toml（那个文件名已写进 .gitignore），
#      并且别把填了 key 的 config.toml 提交上去或发给别人
api_key = ""
# 也可以留空、改用环境变量（优先级低于上面的 api_key）：
#   PowerShell:  $env:LIVETRANS_API_KEY = "sk-..."
#   bash:        export LIVETRANS_API_KEY=sk-...
api_key_env = "LIVETRANS_API_KEY"

timeout = 20.0
# 带上前几句原文+译文作为上下文，翻译更连贯；设为 0 关闭
context_lines = 2
# 追加到系统提示词后面的额外要求，比如
# extra_prompt = "这是游戏实况，游戏名是「原神」，角色名保留日文。"
extra_prompt = ""
retries = 2


[ui]
# 中文字幕字号（像素）
font_size = 26
# 日文原文字号；show_original = false 时不显示
original_font_size = 18
# 字幕板背景不透明度 0~1
opacity = 0.82
# 字幕板宽度占屏幕宽度的比例
width_ratio = 0.86
show_original = true
# 鼠标穿透：开启后点字幕不会挡住下面的直播窗口（推荐开）
# 想拖动字幕位置时，用托盘菜单临时关掉它
click_through = true
# bottom | top
position = "bottom"
# 距屏幕底部/顶部的留白（像素）
margin = 80
# 同屏显示几行
max_lines = 4
